workflows:
  ios_testflight_windows:
    name: LinguFranca iOS TestFlight (Mobile Repo)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.lingufranca.app
        GOOGLE_IOS_CLIENT_ID: 284981345033-uhh8ltpjg2cldtg6iu7n1segitdho9j2.apps.googleusercontent.com
        GOOGLE_WEB_CLIENT_ID: 284981345033-ssp855uprkfrpetnn25ni3074m0ud7f3.apps.googleusercontent.com
        FIREBASE_API_KEY: AIzaSyCEhzRX4ksRPqHL2-xQpRQ2Fk_LR2y6BHI
        FIREBASE_PROJECT_ID: lingufranca-fe189
        FIREBASE_MESSAGING_SENDER_ID: 184373731212
        FIREBASE_IOS_APP_ID: 1:184373731212:ios:41d12ce9cceca7ff9c40a9
        FIREBASE_IOS_BUNDLE_ID: com.lingufranca.app
      groups:
        - app_store_credentials

    scripts:
      - name: Flutter packages
        script: |
          git lfs pull
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install
          cd ..

      - name: Set up iOS code signing
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is empty."
            echo "Create an RSA 2048 private key and save it as a secret env var named CERTIFICATE_PRIVATE_KEY."
            exit 1
          fi
          if ! echo "$CERTIFICATE_PRIVATE_KEY" | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY must be RSA 2048 PEM."
            echo "Expected header: -----BEGIN RSA PRIVATE KEY-----"
            echo "Do not use APP_STORE_CONNECT .p8 key here."
            exit 1
          fi

          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates

      - name: Build IPA
        script: |
          BUILD_NO="${BUILD_NUMBER:-1}"
          BUILD_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NO"
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

      - name: Verify Apple Sign In entitlement
        script: |
          IPA_PATH="$(ls build/ios/ipa/*.ipa | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          rm -rf /tmp/lingufranca_ipa_check
          mkdir -p /tmp/lingufranca_ipa_check
          unzip -q "$IPA_PATH" -d /tmp/lingufranca_ipa_check
          APP_PATH="$(find /tmp/lingufranca_ipa_check/Payload -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found inside IPA."
            exit 1
          fi

          echo "Signed app entitlements:"
          codesign -d --entitlements :- "$APP_PATH" || true

          if ! codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | grep -q "com.apple.developer.applesignin"; then
            echo "ERROR: Signed IPA is missing com.apple.developer.applesignin entitlement."
            echo "Regenerate the App Store provisioning profile for $BUNDLE_ID after enabling Sign in with Apple."
            exit 1
          fi
          if ! codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | grep -q "aps-environment"; then
            echo "ERROR: Signed IPA is missing aps-environment entitlement."
            echo "Enable Push Notifications for $BUNDLE_ID and regenerate the App Store provisioning profile."
            exit 1
          fi

          echo "Apple Sign In and Push Notification entitlements are present in signed IPA."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
